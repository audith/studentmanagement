version: "3.9"

services:
  db:
    image: postgres:15
    container_name: student_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 87654321
      POSTGRES_DB: studentdb
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: student_api
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - .env